name: Build WAHA image (upstream source)

# Manual only. Builds ghcr.io/deepakgaur84/waha from this fork's unmodified WAHA source, using the same
# build arguments upstream uses for its x86 "gows" image. Run it after syncing the fork with upstream.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of this fork to build"
        type: string
        default: core

permissions:
  contents: read
  packages: write

concurrency:
  group: build-waha
  cancel-in-progress: false  # never cut a WAHA build short

jobs:
  waha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/deepakgaur84/waha
          flavor: latest=false
          tags: |
            type=raw,value=gows-latest
            type=sha,prefix=gows-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            USE_BROWSER=none
            WHATSAPP_DEFAULT_ENGINE=GOWS
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=waha
          cache-to: type=gha,mode=max,scope=waha
