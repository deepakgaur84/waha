name: Build archiver image

# Builds ghcr.io/deepakgaur84/waha-archiver automatically whenever the archiver code (or this file)
# changes on the core branch. "Run workflow" in the Actions tab builds it on demand.
on:
  push:
    branches: [core]
    paths:
      - "archiver/**"
      - ".github/workflows/build-archiver.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-archiver
  cancel-in-progress: true   # a newer push replaces a build that is still running

jobs:
  archiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/deepakgaur84/waha-archiver
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: archiver
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=archiver
          cache-to: type=gha,mode=max,scope=archiver
