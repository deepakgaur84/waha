name: Build images

on:
  workflow_dispatch:
    inputs:
      build_waha:
        description: "Build the WAHA image from this fork (unmodified upstream source)"
        type: boolean
        default: false
      build_archiver:
        description: "Build the archiver image"
        type: boolean
        default: true
  push:
    branches: [core]
    paths:
      - "archiver/**"

permissions:
  contents: read
  packages: write

jobs:
  archiver:
    if: github.event_name == 'push' || inputs.build_archiver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/deepakgaur84/waha-archiver
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: archiver
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=archiver
          cache-to: type=gha,mode=max,scope=archiver

  waha:
    if: github.event_name == 'workflow_dispatch' && inputs.build_waha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/deepakgaur84/waha
          flavor: latest=false
          tags: |
            type=raw,value=gows-latest
            type=sha,prefix=gows-,format=short
      # Same build arguments upstream uses for its "gows" (x86, no browser) image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            USE_BROWSER=none
            WHATSAPP_DEFAULT_ENGINE=GOWS
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=waha
          cache-to: type=gha,mode=max,scope=waha
